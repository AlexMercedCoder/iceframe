[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iceframe"
dynamic = ["version"]
description = "A DataFrame-like library for working with Apache Iceberg tables"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Alex Merced", email = "alex@alexmerced.com"}
]
keywords = ["iceberg", "dataframe", "data engineering", "apache iceberg"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    # Upper bound: IceFrame delegates to APIs (Table.maintenance,
    # Table.upsert, Table.inspect, dynamic_partition_overwrite) that are still
    # evolving; a new minor release can move them.
    "pyiceberg>=0.11.0,<0.13",
    "pyarrow>=14.0.0",
    # 1.0 is the real floor: the code uses pl.sql_expr, how="semi"/"anti",
    # vertical_relaxed, pl.len() and rank(descending=...).
    "polars>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
aws = [
    "s3fs>=2023.1.0",
    "boto3>=1.28.0",
]
gcs = [
    "gcsfs>=2023.1.0",
]
azure = [
    "adlfs>=2023.1.0",
]
all = [
    "iceframe[aws]",
    "iceframe[gcs]",
    "iceframe[azure]",
    "iceframe[delta]",
    "iceframe[lance]",
    "iceframe[vortex]",
    "iceframe[excel]",
    "iceframe[gsheets]",
    "iceframe[hudi]",
    "iceframe[sql]",
    "iceframe[xml]",
    "iceframe[stats]",
    "iceframe[api]",
    "iceframe[hf]",
    "iceframe[html]",
    "iceframe[clipboard]",
    "iceframe[pdf,cli,mcp,agent,cache,streaming,monitoring,notebook,pydantic,datafusion,distributed,viz]",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-timeout>=2.3.0",
    "mcp>=2.1.1,<3",
    "black>=23.0.0",
    "ruff>=0.0.270",
    "mypy>=1.3.0",
    "python-dotenv>=1.0.0",
    # The offline test suite runs against PyIceberg's SQLite catalog, which
    # needs SQLAlchemy. Without this the whole core suite errors out on a
    # fresh checkout (and in CI).
    "pyiceberg[sql-sqlite]>=0.11.0",
    # The CLI is a shipped surface, so its tests must run in CI, and several
    # ingestion tests build their fixtures with pandas.
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pandas>=2.0.0",
]
pdf = [
    "fpdf2>=2.7.0",
    "markdown-it-py>=3.0.0",
]
delta = ["deltalake>=0.15.0"]
lance = ["pylance>=0.9.0"]
# EXPERIMENTAL: the Vortex Python package name and API are unverified against a
# real release; ingest.read_vortex warns before use. See docs/ingestion.md.
vortex = ["vortex-data>=0.1.0"]
excel = ["fastexcel>=0.9.0"]
gsheets = ["gspread>=6.0.0"]
hudi = ["getdaft>=0.2.0"]
mcp = ["mcp>=2.1.1,<3"]
ingestion = [
    "iceframe[delta,lance,vortex,excel,gsheets,hudi,sql,xml,stats,api,hf,html,clipboard]",
]
cli = [
    "typer>=0.9.0",
    "rich>=13.0.0",
]
agent = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "google-generativeai>=0.3.0",
    "rich>=13.0.0",
]
cache = [
    "diskcache>=5.6.0",
]
streaming = [
    "kafka-python>=2.0.0",
]
monitoring = [
    "psutil>=5.9.0",
    "prometheus-client>=0.19.0",
]
notebook = [
    "ipython>=8.0.0",
    "ipywidgets>=8.0.0",
]
pydantic = [
    "pydantic>=2.0.0",
]
sql = [
    "connectorx>=0.3.0",
    "sqlalchemy>=2.0.0",
]
xml = [
    "lxml>=4.9.0",
    "pandas>=2.0.0",
]
stats = ["pyreadstat", "pandas>=2.0.0"]
api = ["requests"]
hf = ["datasets"]
html = ["lxml", "html5lib", "beautifulsoup4", "pandas>=2.0.0"]
clipboard = ["pyperclip", "pandas>=2.0.0"]
datafusion = [
    "datafusion>=35.0.0",
]
distributed = [
    "ray>=2.0.0",
]
viz = [
    "altair>=5.0.0",
]

[project.scripts]
iceframe = "iceframe.entrypoints:cli"
iceframe-chat = "iceframe.entrypoints:chat"

[project.urls]
Homepage = "https://github.com/AlexMercedCoder/iceframe"
Documentation = "https://github.com/AlexMercedCoder/iceframe/tree/main/docs"
Repository = "https://github.com/AlexMercedCoder/iceframe"
Issues = "https://github.com/AlexMercedCoder/iceframe/issues"

[tool.setuptools.dynamic]
version = {attr = "iceframe.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["iceframe*"]
exclude = ["tests*", "scripts*", "docs*"]

[tool.setuptools.package-data]
iceframe = ["py.typed"]

[tool.setuptools.data-files]
"share/iceframe/docs" = ["docs/*.md"]
"share/iceframe/docs/recipes" = ["docs/recipes/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
timeout = 60
markers = [
    "live: test requires a live REST catalog (opt in with --live)",
    "slow: long-running test",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "I",    # isort
]
ignore = [
    "E501",   # line length is handled by the formatter
    "E741",   # ambiguous variable names (l, I) in vendored-style code
    "B008",   # function call in default arg (typer/pydantic idiom)
]

[tool.ruff.lint.per-file-ignores]
# Tests routinely import after a skip guard (E402) and assert broadly on
# catalog-dependent failures (B017).
"tests/*" = ["B011", "B017", "E402", "F841"]
"iceframe/__init__.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
check_untyped_defs = true
files = ["iceframe"]
